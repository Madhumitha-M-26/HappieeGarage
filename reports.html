<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Garage - Reports</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <h1>Happy <span>Garage</span> &nbsp;|&nbsp; Reports</h1>
    <div>
      <a href="admin.html" style="color:#ffc700">Back to Admin</a> &nbsp;
      <button id="btnLogout" class="small">Logout</button>
    </div>
  </div>

  <div class="page">
    <div class="card">
      <h2>Choose a report</h2>
      <div class="row">
        <select id="reportType">
          <optgroup label="Customer reports">
            <option value="c_all">All customers</option>
            <option value="c_top">Top 10 customers (date range)</option>
            <option value="c_cash">Cash purchases by customer (date range)</option>
            <option value="c_credit">Credit purchases by customer (date range)</option>
          </optgroup>
          <optgroup label="Inventory reports">
            <option value="i_all">Current stock: all cars</option>
            <option value="i_cat">Current stock: by category</option>
            <option value="i_high">High stock (more than 100)</option>
            <option value="i_low">Low stock (less than 15)</option>
          </optgroup>
          <optgroup label="Sales reports (date range)">
            <option value="s_all">All sales</option>
            <option value="s_cat">Category-wise sales</option>
            <option value="s_cash">Cash sales</option>
            <option value="s_credit">Credit sales</option>
            <option value="s_top">Top 10 selling cars</option>
            <option value="s_bottom">Bottom 10 selling cars</option>
          </optgroup>
        </select>
      </div>

      <div class="row">
        <label>From <input type="date" id="from"></label>
        <label>To <input type="date" id="to"></label>
        <span id="catWrap" style="display:none"><select id="repCat"></select></span>
      </div>
      <p style="font-size:13px;color:#6b7280">Dates apply to customer purchase and sales reports. Leave empty for all dates.</p>

      <div class="row">
        <button id="btnRun">Show Report</button>
        <button id="btnPrint" class="gray">Print</button>
      </div>
    </div>

    <div class="card">
      <h2 id="title">Report</h2>
      <table id="result"></table>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
