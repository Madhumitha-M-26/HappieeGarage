<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Happy Garage - My Orders</title><link rel="stylesheet" href="css/style.css"></head>
<body>
  <div class="topbar"><h1>Happy <span>Garage</span></h1><a href="shop.html">Back to Shop</a></div>
  <div class="page">
    <div class="card orders-card">
      <h2>My Garage <span>Order History</span></h2>
      <p style="color:var(--muted);margin-top:-4px">Every race, every collectible, all in one place.</p>
      <table id="list"></table>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
    auth.onAuthStateChanged(u => {
      if (!u) return (location.href = "index.html");
      db.collection("orders").where("customerId", "==", u.uid).get().then(snap => {
        const list = [];
        snap.forEach(d => list.push({ id: d.id, ...d.data() }));
        list.sort((a, b) => (b.createdAt ? b.createdAt.seconds : 0) - (a.createdAt ? a.createdAt.seconds : 0));
        let html = "<tr><th>Date</th><th>Cars</th><th>Payment</th><th>Total</th><th></th></tr>";
        list.forEach(o => {
          const date = o.createdAt ? o.createdAt.toDate().toLocaleString() : "";
          html += `<tr><td>${date}</td><td>${o.items.map(i => i.title + " x" + i.qty).join(", ")}</td><td>${o.paymentMode}</td><td>₹${o.total}</td><td><a href="bill.html?id=${o.id}">View bill</a></td></tr>`;
        });
        if (!list.length) html += '<tr><td colspan="5">No orders yet</td></tr>';
        $("#list").html(html);
      }).catch(e => $("#list").html("<tr><td>Error: " + e.message + "</td></tr>"));
    });
  </script>
</body>
</html>
